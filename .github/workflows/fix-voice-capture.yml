name: Fix voice capture readiness

on:
  push:
    branches: [fix-voice-cycle-restart]
    paths:
      - scripts/patch-voice-capture.py
      - .github/workflows/fix-voice-capture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-voice-cycle-restart
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-voice-capture.py
      - name: Validate source and build
        run: |
          npm run check
          grep -q "rec.maxAlternatives=5" src/js/07-reading-voice-bootstrap.part.js
          grep -q "rec.onaudiostart=markAudioCaptureStarted" src/js/07-reading-voice-bootstrap.part.js
          grep -q "starting?'⏳'" src/js/07-reading-voice-bootstrap.part.js
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/07-reading-voice-bootstrap.part.js
          git commit -m "fix: wait for real audio capture before showing listening"
          git push origin HEAD:fix-voice-cycle-restart
