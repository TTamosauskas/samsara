name: Fix voice DOM choice execution

on:
  push:
    branches: [fix-voice-choice-execution]
    paths:
      - tools/fix-voice-dom-choice.py
      - .github/workflows/fix-voice-dom-choice.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact Book-button patch
        run: python tools/fix-voice-dom-choice.py
      - name: Validate source and build
        run: |
          grep -q "button.click()" src/js/07-reading-voice-bootstrap.part.js
          grep -q "action.type==='alternative'" src/js/07-reading-voice-bootstrap.part.js
          npm run check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/07-reading-voice-bootstrap.part.js
          git commit -m "fix: route spoken alternatives through the Book button"
          git push
