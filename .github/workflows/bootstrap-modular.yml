name: Bootstrap modular source

on:
  push:
    branches: [sync-modular-temp2]
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-modular-temp2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and validate modular source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-*.txt | base64 -d > /tmp/samsara-source.tar.xz
          sha256sum /tmp/samsara-source.tar.xz
          xz -t /tmp/samsara-source.tar.xz
          rm -rf bootstrap
          tar -xJf /tmp/samsara-source.tar.xz -C .
          rm -f .github/workflows/bootstrap-modular.yml
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: modularize Samsara runtime"
          git push origin HEAD:sync-modular-temp2
