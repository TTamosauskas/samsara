name: Fix voice choice execution

on:
  push:
    branches: [fix-voice-choice-execution]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-voice-choice-execution
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-voice-choice-execution.py
      - name: Validate source and build
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "runVoiceNarrativeChoice(index)" src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "renderBookSubpage(appState.bookSubpageCount-1" src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "return choose(choice,index)" src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "if(actionError&&!advanced)" src/js/07-reading-voice-bootstrap.part.js
          npm run check
      - name: Commit validated fix
        shell: bash
        run: |
          rm -f scripts/patch-voice-choice-execution.py .github/workflows/fix-voice-choice-execution.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: execute spoken choices from the Book state'
          git push origin HEAD:fix-voice-choice-execution
