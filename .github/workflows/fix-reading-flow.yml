name: Fix Samsara reading flow

on:
  push:
    branches:
      - fix-reading-flow

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-reading-flow
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-reading-flow.py
      - name: Validate source
        run: |
          node --check src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "for(const spec of getAvailableActions('choice',{section:s}))" src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "run:()=>spec.execute?.()" src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "function voicePromptForActions(actions=[],lead='O que você faz?')" src/js/07-reading-voice-bootstrap.part.js
          ! grep -Fq "voicePromptForActions(actions,'Opções:')" src/js/07-reading-voice-bootstrap.part.js
          ! grep -Fq "cancelVoiceRecognition();interruptVoiceSpeech();appState.voiceContextKey=''" src/js/07-reading-voice-bootstrap.part.js
          npm run check
      - name: Commit validated fix
        run: |
          rm -f scripts/patch-reading-flow.py
          rm -f .github/workflows/fix-reading-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make reading choices immediate and actionable'
          git push origin HEAD:fix-reading-flow
