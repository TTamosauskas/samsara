name: Fix reading microphone indicator

on:
  push:
    branches: [fix-reading-mic-indicator]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-reading-mic-indicator

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: python scripts/patch-reading-mic-indicator.py

      - name: Validate behavior and build
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "rec.onstart=()=>" src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "appState.voiceListening=true;syncVoiceUi()" src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "await startVoiceListening(surface.actions,surface.key)" src/js/07-reading-voice-bootstrap.part.js
          grep -Fq "body.reading-assist-enabled:not(.editor) .voice-float-btn{display:grid!important}" assets/css/styles.css
          ! grep -Fq "body:not(.audio-mode) .voice-header-btn,body:not(.audio-mode) .voice-float-btn" assets/css/styles.css
          npm run check

      - name: Commit validated fix
        shell: bash
        run: |
          rm -f scripts/patch-reading-mic-indicator.py .github/workflows/fix-reading-mic-indicator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: expose real reading microphone state'
          git push origin HEAD:fix-reading-mic-indicator
