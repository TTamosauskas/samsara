name: Fix voice action settlement
on:
  push:
    branches: [fix-voice-action-settlement]
    paths:
      - '.github/workflows/fix-voice-action-settlement.yml'
      - 'scripts/fix-voice-action-settlement.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-voice-action-settlement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply voice settlement patch
        run: python scripts/fix-voice-action-settlement.py
      - name: Validate source and build
        run: |
          grep -F "return action.execute();" src/js/04-adventure-runtime-render.part.js
          grep -F "voiceActionPending" src/js/07-reading-voice-bootstrap.part.js
          grep -F "waitVoiceActionSettlement" src/js/07-reading-voice-bootstrap.part.js
          npm run check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/04-adventure-runtime-render.part.js src/js/07-reading-voice-bootstrap.part.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: wait for spoken choice settlement"
          git push origin HEAD:fix-voice-action-settlement
